[package]
name = "exhume_btrfs"
version = "0.1.0"
edition = "2024"
description = "Read-only parsing of Btrfs filesystems for the Exhume toolkit (trees, subvolumes, snapshots, compressed extents)."
documentation = "https://www.forensicxlab.com/docs/category/exhume---btrfs"
repository = "https://github.com/forensicxlab/exhume_btrfs"
readme = "README.md"
authors = ["k1nd0ne"]
license = "GPL-3.0-only"

[dependencies]
log = "0.4"
env_logger = "0.11"
prettytable-rs = "0.10"
clap = { version = "4", features = ["cargo"] }
clap-num = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
exhume_body = "=0.5.7"
flate2 = "1"
ruzstd = "0.8"
sha2 = "0.10"
blake2 = "0.10"

[dev-dependencies]
tempfile = "3"
